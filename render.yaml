services:
  - type: web
    name: agente-de-candidaturas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTH_REQUIRED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MFA_LOGIN_ENFORCE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OUTLOOK_CLIENT_ID
        sync: false
      - key: OUTLOOK_CLIENT_SECRET
        sync: false
      - key: OUTLOOK_REDIRECT_URI
        sync: false
      - key: GMAIL_AUTO_SYNC
        value: "true"
      - key: OUTLOOK_AUTO_SYNC
        value: "true"
      - key: DOCUMENT_EXPORT_PRICE
        sync: false
      - key: DOCUMENT_EXPORT_CHECKOUT_URL
        sync: false
      - key: DOCUMENT_EXPORT_PRICE_CENTS
        sync: false
      - key: DOCUMENT_EXPORT_ALLOWED_EMAILS
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: INFINITEPAY_HANDLE
        sync: false
      - key: INFINITEPAY_EXPORT_PRICE_CENTS
        sync: false
