services:
  - type: web
    name: agente-de-candidaturas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - candidaturacerta.com.br
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTH_REQUIRED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: PWNED_PASSWORD_CHECK
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_VIDEO_URL
        sync: false
      - key: APP_BASE_URL
        value: "https://candidaturacerta.com.br"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OUTLOOK_CLIENT_ID
        sync: false
      - key: OUTLOOK_CLIENT_SECRET
        sync: false
      - key: OUTLOOK_REDIRECT_URI
        sync: false
      - key: GMAIL_AUTO_SYNC
        value: "true"
      - key: OUTLOOK_AUTO_SYNC
        value: "true"
      - key: DOCUMENT_EXPORT_PRICE
        sync: false
      - key: DOCUMENT_EXPORT_CHECKOUT_URL
        sync: false
      - key: DOCUMENT_EXPORT_PRICE_CENTS
        value: "990"
      - key: DOCUMENT_EXPORT_ALLOWED_EMAILS
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RATE_LIMIT_DISTRIBUTED_REQUIRED
        value: "true"
