<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        registration.unregister().then(function(boolean) {
          if(boolean) console.log("Service Worker deletado com sucesso do cliente!");
        });
      }
    });
  }
</script>
    <meta charset="utf-8">
    <title>Admin - Candidatura Certa</title>
    <style>
html { font-size: 16px !important; }
body { font-size: 1rem !important; }

        *, *::before, *::after { box-sizing: border-box; } html, body { max-width: 100vw; overflow-x: hidden; } body { font-family: system-ui, -apple-system, sans-serif; background: #f4f7fa; margin: 0; padding: 20px; color: #333; font-size: 16px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a365d; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fafbfc; }
        .card h3 { margin-top: 0; color: #2d3748; font-size: 16px; }
        .metric { font-size: 28px; font-weight: bold; color: #2b6cb0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
        form { margin-top: 15px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 5px; box-sizing: border-box; }
        button { background: #3182ce; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        .success { color: green; font-weight: bold; margin-bottom: 10px; }
        .error { color: red; font-weight: bold; margin-bottom: 10px; }
    </style>

<body>
    <div class="container">
        <h1>Painel Administrativo</h1>
        <div id="msg"></div>
        <div class="grid">
            <div class="card">
                <h3>Métricas de Conversão</h3>
                <div class="metric" id="total_users">-</div>
                <small>Total de contas criadas</small>
            </div>
            <div class="card">
                <h3>Financeiro / Vendas</h3>
                <div>MRR Estimado: <strong id="mrr">-</strong></div>
                <div>Vendas E-book: <strong id="sales_ebook">-</strong></div>
                <div>Vendas LinkedIn: <strong id="sales_linkedin">-</strong></div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h3>Distribuição por Planos</h3>
                <table>
                    <thead><tr><th>Plano</th><th>Usuários Ativos</th></tr></thead>
                    <tbody id="plans_tbody"></tbody>
                </table>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h3>Gerenciar Plano / Conceder Cortesia</h3>
                <form id="grantForm">
                    <label>E-mail do Usuário:</label>
                    <input type="email" id="userEmail" required placeholder="email@exemplo.com">
                    
                    <label>Selecione o Plano:</label>
                    <select id="userPlan" required>
                        <option value="essential">Essencial (Grátis / Revogar Acesso)</option>
                        <option value="start">Start (R$ 34,90/mês)</option>
                        <option value="pro">Pro (R$ 99,00/mês)</option>
                        <option value="consultoria">Consultoria (R$ 197,00/mês)</option>
                    </select>
                    
                    <button type="submit">Aplicar Alteração</button>
                </form>
            </div>
        </div>
    </div>
    <script>
    console.log("Dados recebidos no HTML do Admin:", {
        users: "{{ total_users }}",
        mrr: "{{ mrr_estimado }}"
    });
    
    document.getElementById('grantForm').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('userEmail').value;
        const plan = document.getElementById('userPlan').value;
        const msg = document.getElementById('msg');
        msg.innerHTML = "Carregando...";
        
        const res = await fetch('/admin/grant', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, plan})
        });
        const data = await res.json();
        if (res.ok) {
            msg.innerHTML = '<div class="success">Plano concedido com sucesso! Recarregue a página.</div>';
        } else {
            msg.innerHTML = <div class="error">Erro: </div>;
        }
    };
</script>
</body>
</html>
