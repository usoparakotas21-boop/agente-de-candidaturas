<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidaturas | Agente de Candidaturas</title><style>
:root{--ink:#09284d;--muted:#60758d;--blue:#0b5a99;--line:#dbe6f0;--bg:#f6f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.top{height:64px;background:#092f56;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand,.top a{color:#fff;text-decoration:none;font-weight:800}.top a:last-child{font-size:13px;color:#d8e9f7}.wrap{width:min(1060px,calc(100% - 36px));margin:0 auto;padding:40px 0 70px}.intro{margin-bottom:25px}.intro h1{margin:0 0 6px;font-size:38px;letter-spacing:-.03em}.intro p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat strong{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}.list{display:grid;gap:11px}.item{display:grid;grid-template-columns:1fr auto;gap:15px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 18px #163b5908}.item h2{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px}.meta span+span:before{content:' · ';color:#9aabbc}.badges{display:flex;align-items:start;gap:8px;flex-wrap:wrap;justify-content:end}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;background:#e8f2fa;color:var(--blue);font-size:11px;font-weight:800;white-space:nowrap}.score{color:#16805a;background:#e4f7ee}.empty{padding:48px;text-align:center;border:1px dashed #b9cada;border-radius:15px;color:var(--muted);background:#fff}.empty strong{display:block;color:var(--ink);margin-bottom:5px}@media(max-width:650px){.toolbar{display:grid;grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.item{display:block}.badges{justify-content:start;margin-top:12px}}
</style></head><body><header class="top"><a class="brand" href="/dashboard">AC&nbsp; Agente de Candidaturas</a><a href="/vagas">Banco de vagas →</a></header><main class="wrap"><div class="intro"><h1>Minhas candidaturas</h1><p>Acompanhe cada oportunidade desde a análise até a entrevista.</p></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar por cargo ou empresa"><select id="status"><option value="">Todos os status</option><option>IDENTIFICADA</option><option>ANALISADA</option><option>PERSONALIZADA</option><option>CURRICULO_GERADO</option><option>CANDIDATURA_ENVIADA</option><option>ENTREVISTA</option><option>APROVADO</option><option>RECUSADO</option><option>ARQUIVADA</option></select><select id="decision"><option value="">Todas as decisões</option><option>AUTOMATICA</option><option>REVISAR</option><option>DESCARTAR</option></select></div><div class="stats"><div class="stat"><strong id="total">—</strong><span>total</span></div><div class="stat"><strong id="review">—</strong><span>em revisão</span></div><div class="stat"><strong id="interviews">—</strong><span>entrevistas</span></div><div class="stat"><strong id="approved">—</strong><span>aprovadas</span></div></div><div id="list" class="list"><div class="empty">Carregando candidaturas...</div></div></main><script>
let apps=[];const $=id=>document.getElementById(id);const labels={IDENTIFICADA:'Identificada',ANALISADA:'Analisada',PERSONALIZADA:'Personalizada',CURRICULO_GERADO:'Currículo gerado',CANDIDATURA_ENVIADA:'Enviada',ENTREVISTA:'Entrevista',APROVADO:'Aprovada',RECUSADO:'Recusada',ARQUIVADA:'Arquivada'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase().trim(),st=$('status').value,d=$('decision').value;const rows=apps.filter(a=>(!q||`${a.job_title} ${a.company}`.toLowerCase().includes(q))&&(!st||a.status===st)&&(!d||a.queue_decision===d));$('total').textContent=apps.length;$('review').textContent=apps.filter(a=>a.queue_decision==='REVISAR').length;$('interviews').textContent=apps.filter(a=>a.status==='ENTREVISTA').length;$('approved').textContent=apps.filter(a=>a.status==='APROVADO').length;if(!rows.length){$('list').innerHTML='<div class="empty"><strong>Nenhuma candidatura encontrada</strong>As oportunidades analisadas aparecerão aqui.</div>';return}$('list').innerHTML=rows.map(a=>`<article class="item"><div><h2>${esc(a.job_title||'Cargo não informado')}</h2><div class="meta"><span>${esc(a.company||'Empresa não informada')}</span><span>${esc(a.status?labels[a.status]||a.status:'Sem status')}</span></div></div><div class="badges"><span class="badge score">${a.analysis_score==null?'Score pendente':Math.round(a.analysis_score)+'% match'}</span><span class="badge">${esc(labels[a.status]||a.status||'Revisar')}</span></div></article>`).join('')}fetch('/applications').then(r=>r.json()).then(d=>{apps=d.applications||[];render()}).catch(()=>{$('list').innerHTML='<div class="empty">Não foi possível carregar as candidaturas agora.</div>'});$('search').addEventListener('input',render);$('status').addEventListener('change',render);$('decision').addEventListener('change',render);
</script></body></html>
