<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vagas | Agente de Candidaturas</title><style>
:root{--ink:#09284d;--muted:#60758d;--blue:#0b5a99;--line:#dbe6f0;--bg:#f6f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.top{height:64px;background:#092f56;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand,.top a{color:#fff;text-decoration:none;font-weight:800}.top a:last-child{font-size:13px;color:#d8e9f7}.wrap{width:min(1060px,calc(100% - 36px));margin:0 auto;padding:40px 0 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:25px}.intro h1{margin:0 0 6px;font-size:38px;letter-spacing:-.03em}.intro p{margin:0;color:var(--muted)}.button{display:inline-block;padding:11px 17px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;white-space:nowrap}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat strong{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}.list{display:grid;gap:11px}.job{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 18px #163b5908}.job h2{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px}.meta span+span:before{content:' · ';color:#9aabbc}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;background:#e8f2fa;color:var(--blue);font-size:11px;font-weight:800;white-space:nowrap}.empty{padding:48px;text-align:center;border:1px dashed #b9cada;border-radius:15px;color:var(--muted);background:#fff}.empty strong{display:block;color:var(--ink);margin-bottom:5px}@media(max-width:650px){.intro{display:block}.intro .button{margin-top:16px}.toolbar{display:grid;grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.job{display:block}.job .badge{margin-top:11px}}
</style></head><body><header class="top"><a class="brand" href="/dashboard">AC&nbsp; Agente de Candidaturas</a><a href="/configuracoes">Configurações →</a></header><main class="wrap"><div class="intro"><div><h1>Banco de vagas</h1><p>Veja, filtre e acompanhe as oportunidades capturadas para o seu perfil.</p></div><a class="button" href="/dashboard">Captar nova vaga</a></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar por cargo ou empresa"><select id="source"><option value="">Todas as origens</option><option value="linkedin">LinkedIn</option><option value="indeed">Indeed</option><option value="gupy">Gupy</option><option value="email">E-mail</option><option value="manual">Manual</option></select></div><div class="stats"><div class="stat"><strong id="total">—</strong><span>vagas capturadas</span></div><div class="stat"><strong id="remote">—</strong><span>remotas</span></div><div class="stat"><strong id="origins">—</strong><span>origens ativas</span></div></div><div id="list" class="list"><div class="empty">Carregando vagas...</div></div></main><script>
let jobs=[];const $=id=>document.getElementById(id);function render(){const q=$('search').value.toLowerCase().trim(),s=$('source').value;const rows=jobs.filter(j=>(!q||`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q))&&(!s||j.source===s));$('total').textContent=jobs.length;$('remote').textContent=jobs.filter(j=>`${j.modality} ${j.location}`.toLowerCase().includes('remot')).length;$('origins').textContent=new Set(jobs.map(j=>j.source)).size;if(!rows.length){$('list').innerHTML='<div class="empty"><strong>Nenhuma vaga encontrada</strong>Capture uma oportunidade no dashboard para começar sua fila.</div>';return}$('list').innerHTML=rows.map(j=>`<article class="job"><div><h2>${esc(j.title||'Cargo não informado')}</h2><div class="meta"><span>${esc(j.company||'Empresa não informada')}</span><span>${esc(j.location||'Localização não informada')}</span><span>${esc(j.modality||'Modalidade não informada')}</span></div></div><span class="badge">${esc(j.source||'manual')}</span></article>`).join('')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}fetch('/jobs').then(r=>r.json()).then(d=>{jobs=d.jobs||[];render()}).catch(()=>{$('list').innerHTML='<div class="empty">Não foi possível carregar as vagas agora.</div>'});$('search').addEventListener('input',render);$('source').addEventListener('change',render);
</script></body></html>
