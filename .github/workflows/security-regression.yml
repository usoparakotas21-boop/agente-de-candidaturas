name: Security regression (isolated)
on:
  push:
    branches: ['audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: audit_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'sqlite://'
      AUTH_REQUIRED: 'false'
      GMAIL_AUTO_SYNC: 'false'
      OUTLOOK_AUTO_SYNC: 'false'
      AUDIT_POSTGRES_URL: 'postgresql+psycopg://postgres:local-test-only@127.0.0.1:5432/audit_security'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: node --test tests/test_audit_xss.cjs tests/chrome-extension.test.cjs tests/test_landing_checkout.cjs tests/test_ai_simulator.js tests/test_guided_onboarding.js
